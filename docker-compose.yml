services:
  db:
    image: postgres:16-alpine
    container_name: yelos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - yelos_postgres_data:/var/lib/postgresql/data

volumes:
  yelos_postgres_data: