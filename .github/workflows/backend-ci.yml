name: Backend CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yelos_test
          POSTGRES_USER: yy
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yy -d yelos_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/yelos_test
      DB_USERNAME: yy
      DB_PASSWORD: 123456
      JWT_SECRET: test-secret-key-for-github-actions-at-least-32-characters-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Give Maven wrapper execute permission
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test

