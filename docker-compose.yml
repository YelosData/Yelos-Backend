services:
  db:
    image: postgres:16-alpine
    container_name: yelos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - yelos_postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3-management
    container_name: yelos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: yy
      RABBITMQ_DEFAULT_PASS: 123456
    volumes:
      - yelos_rabbitmq_data:/var/lib/rabbitmq

volumes:
  yelos_postgres_data:
  yelos_rabbitmq_data:
